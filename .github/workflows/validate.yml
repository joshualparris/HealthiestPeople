name: Validate Static Site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check site-data.js
          node --check resources-data.js
          node --check app.js
          node --check nav.js
          node --check charts.js
          node --check doc-renderer.js
          node --check data-explorer.js
          node --check profile-data.js
          node --check person-page.js

      - name: Check required site files
        run: |
          test -f index.html
          test -f plan.html
          test -f people.html
          test -f charts.html
          test -f resources.html
          test -f evidence.html
          test -f playbook.html
          test -f comparison.html
          test -f transferability.html
          test -f methodology.html
          test -f health-archive.html
          test -f plan-rationale.html
          test -f plan-evidence.html
          test -f source-policy.html
          test -f data.html
          test -f styles.css
          test -f site-data.js
          test -f resources-data.js
          test -f app.js
          test -f nav.js
          test -f charts.js
          test -f doc-renderer.js
          test -f data-explorer.js
          test -f profile-data.js
          test -f person-page.js
          test -f people/joshua-parris.html
          test -f people/bryan-johnson.html
          test -f people/michael-lustgarten.html
          test -f people/oskar-svendsen.html
          test -f people/dave-pascoe.html
          test -f people/scott-kelly.html
          test -f people/julie-gibson-clark.html
          test -f people/bob-troia.html
          test -f people/michael-snyder.html
          test -f people/larry-smarr.html
          test -f vercel.json

      - name: Check page wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          pages = {
              "index.html": ['styles.css', 'site-data.js', 'app.js', 'nav.js', 'id="today"'],
              "plan.html": ['styles.css', 'site-data.js', 'app.js', 'nav.js', 'id="plan"', 'id="baseline"', 'id="glossary"'],
              "people.html": ['styles.css', 'site-data.js', 'app.js', 'nav.js', 'id="people"', 'id="principles"'],
              "resources.html": ['styles.css', 'site-data.js', 'resources-data.js', 'app.js', 'nav.js', 'id="listen"', 'id="watch-read"'],
              "charts.html": ['styles.css', 'charts.js', 'nav.js', 'id="personal-charts"', 'id="public-charts"', 'id="diagrams"'],
              "evidence.html": ['styles.css', 'nav.js', 'id="grades"', 'id="rules"', 'id="research"'],
              "document.html": ['styles.css', 'doc-renderer.js', 'nav.js', 'id="doc-content"', 'id="doc-toc"'],
              "roadmap.html": ['styles.css', 'doc-renderer.js', 'nav.js', 'id="doc-content"', 'id="doc-toc"'],
              "playbook.html": ['styles.css', 'doc-renderer.js', 'data-doc-source="docs/practical-playbook.md"'],
              "comparison.html": ['styles.css', 'doc-renderer.js', 'data-doc-source="docs/comparison.md"'],
              "transferability.html": ['styles.css', 'doc-renderer.js', 'data-doc-source="docs/transferability.md"'],
              "methodology.html": ['styles.css', 'doc-renderer.js', 'data-doc-source="docs/evidence-and-bias.md"'],
              "health-archive.html": ['styles.css', 'doc-renderer.js', 'data-doc-source="docs/people/joshua-parris-full-health-archive.md"'],
              "plan-rationale.html": ['styles.css', 'doc-renderer.js', 'data-doc-source="docs/josh-plan.md"'],
              "plan-evidence.html": ['styles.css', 'doc-renderer.js', 'data-doc-source="docs/josh-plan-evidence.md"'],
              "source-policy.html": ['styles.css', 'doc-renderer.js', 'data-doc-source="docs/source-policy.md"'],
              "data.html": ['styles.css', 'data-explorer.js', 'id="dataset-tabs"', 'id="data-search"'],
              "people/bryan-johnson.html": ['../styles.css', '../site-data.js', '../resources-data.js', '../profile-data.js', '../person-page.js', '../nav.js', 'data-person-id="bryan-johnson"'],
              "people/oskar-svendsen.html": ['../styles.css', '../profile-data.js', '../person-page.js', 'data-person-id="oskar-svendsen"'],
              "people/scott-kelly.html": ['../styles.css', '../profile-data.js', '../person-page.js', 'data-person-id="scott-kelly"'],
          }

          errors = []
          for filename, required in pages.items():
              html = Path(filename).read_text()
              missing = [item for item in required if item not in html]
              if missing:
                  errors.append(f"{filename}: {missing}")

          if errors:
              raise SystemExit("Missing page wiring:\n" + "\n".join(errors))

          print("Multi-page static site wiring OK")
          PY

      - name: Reject public raw Markdown or CSV links
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          public = ["index.html","plan.html","people.html","charts.html","resources.html","evidence.html"]
          bad = []
          pattern = re.compile(r'href=["\'\']([^"\'\']+\.(?:md|csv)(?:#[^"\'\']*)?)["\'\']', re.I)
          for filename in public:
              text = Path(filename).read_text()
              for href in pattern.findall(text):
                  bad.append(f"{filename}: {href}")
          if bad:
              raise SystemExit("Raw research links found:\n" + "\n".join(bad))
          print("No public raw Markdown/CSV links")
          PY


      - name: Check internal links resolve
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from urllib.parse import urlsplit

          root = Path(".").resolve()
          failures = []

          def local_target(source_file, raw):
              if not raw or raw.startswith(("#", "mailto:", "tel:", "javascript:", "data:")):
                  return None
              parts = urlsplit(raw)
              if parts.scheme or parts.netloc:
                  return None
              path = parts.path
              if not path:
                  return None
              if path.startswith("/HealthiestPeople/"):
                  target = root / path.removeprefix("/HealthiestPeople/")
              elif path.startswith("/"):
                  return None
              else:
                  target = (source_file.parent / path).resolve()
              return target

          # Literal href/src links in every public HTML page.
          attr = re.compile(r'(?:href|src)=["\']([^"\']+)["\']', re.I)
          for page in root.rglob("*.html"):
              text = page.read_text(errors="ignore")
              for raw in attr.findall(text):
                  target = local_target(page, raw)
                  if target is None:
                      continue
                  try:
                      target.relative_to(root)
                  except ValueError:
                      failures.append(f"{page.relative_to(root)} -> {raw} escapes repository root")
                      continue
                  if not target.exists():
                      failures.append(f"{page.relative_to(root)} -> {raw} (missing {target.relative_to(root)})")

          # data-doc-source files loaded by the Markdown renderer.
          doc_source = re.compile(r'data-doc-source=["\']([^"\']+)["\']', re.I)
          rendered_sources = []
          for page in root.rglob("*.html"):
              text = page.read_text(errors="ignore")
              for raw in doc_source.findall(text):
                  target = (page.parent / raw).resolve()
                  if not target.exists():
                      failures.append(f"{page.relative_to(root)} data-doc-source -> {raw}")
                  else:
                      rendered_sources.append(target)

          # Ensure every local Markdown/CSV link in rendered documents is routed
          # by doc-renderer.js to a real public target.
          renderer = (root / "doc-renderer.js").read_text()
          route_pairs = dict(re.findall(r'"([^"]+\.(?:md|csv))"\s*:\s*"([^"]+)"', renderer, re.I))
          md_link = re.compile(r'\[[^\]]+\]\(([^)]+)\)')
          for source in rendered_sources:
              text = source.read_text(errors="ignore")
              for raw in md_link.findall(text):
                  if raw.startswith(("#", "mailto:", "tel:")) or re.match(r'^https?://', raw, re.I):
                      continue
                  clean = urlsplit(raw).path
                  if not re.search(r'\.(?:md|csv)$', clean, re.I):
                      continue
                  key = Path(clean).name
                  route = route_pairs.get(key)
                  if not route:
                      failures.append(f"{source.relative_to(root)} -> {raw} has no doc-renderer route")
                      continue
                  route_path = urlsplit(route).path
                  target = root / route_path
                  if not target.exists():
                      failures.append(f"{source.relative_to(root)} -> {raw} routes to missing {route_path}")

          if failures:
              raise SystemExit("Broken internal links:\n" + "\n".join(sorted(set(failures))))

          print("All internal page, asset and rendered-document links resolve")
          PY


      - name: Reject raw Markdown website links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          errors = []

          # No user-facing HTML anchor should send a visitor directly to a .md file.
          for path in list(Path(".").glob("*.html")) + list(Path("people").glob("*.html")):
              text = path.read_text()
              for match in re.finditer(r'href=["\']([^"\']+\.md(?:#[^"\']*)?)["\']', text, re.I):
                  errors.append(f"{path}: raw Markdown href -> {match.group(1)}")

          # Dynamic profile/source data must use pretty pages or the document viewer.
          profile = Path("profile-data.js").read_text()
          for match in re.finditer(r'["\'](?:\.\./)?docs/[^"\']+\.md["\']', profile, re.I):
              errors.append(f"profile-data.js: raw Markdown URL -> {match.group(0)}")

          metrics = Path("data/metrics.csv").read_text()
          for line_no, line in enumerate(metrics.splitlines(), 1):
              if re.search(r',docs/[^,]+\.md(?:,|$)', line, re.I):
                  errors.append(f"data/metrics.csv:{line_no}: raw Markdown source URL")

          if errors:
              raise SystemExit("Raw Markdown website links found:\n" + "\n".join(errors))

          print("No raw Markdown website links")
          PY

name: Validate Static Site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check site-data.js
          node --check resources-data.js
          node --check app.js
          node --check nav.js
          node --check charts.js

      - name: Check required site files
        run: |
          test -f index.html
          test -f plan.html
          test -f people.html
          test -f charts.html
          test -f resources.html
          test -f evidence.html
          test -f styles.css
          test -f site-data.js
          test -f resources-data.js
          test -f app.js
          test -f nav.js
          test -f charts.js
          test -f vercel.json

      - name: Check page wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          pages = {
              "index.html": ['styles.css', 'site-data.js', 'app.js', 'nav.js', 'id="today"'],
              "plan.html": ['styles.css', 'site-data.js', 'app.js', 'nav.js', 'id="plan"', 'id="baseline"', 'id="glossary"'],
              "people.html": ['styles.css', 'site-data.js', 'app.js', 'nav.js', 'id="people"', 'id="principles"'],
              "resources.html": ['styles.css', 'site-data.js', 'resources-data.js', 'app.js', 'nav.js', 'id="listen"', 'id="watch-read"'],
              "charts.html": ['styles.css', 'charts.js', 'nav.js', 'id="personal-charts"', 'id="public-charts"', 'id="diagrams"'],
              "evidence.html": ['styles.css', 'nav.js', 'id="grades"', 'id="rules"', 'id="research"'],
          }

          errors = []
          for filename, required in pages.items():
              html = Path(filename).read_text()
              missing = [item for item in required if item not in html]
              if missing:
                  errors.append(f"{filename}: {missing}")

          if errors:
              raise SystemExit("Missing page wiring:\n" + "\n".join(errors))

          print("Multi-page static site wiring OK")
          PY
